# Builds PickD into an unsigned .ipa on a GitHub Mac.
# Sideloadly then signs it with your free Apple ID and installs it on your iPhone.
name: Build iPhone app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Copy the app into the iOS project
        run: npx cap sync ios

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package PickD.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry PickD.ipa Payload
          ls -lh PickD.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PickD-ipa
          path: PickD.ipa
          retention-days: 30
